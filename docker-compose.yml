# =============================================================================
# docker-compose.yml for django-unfold with Persian RTL support
# =============================================================================
# Quick start:
#   1. cp .env.example .env  (then edit values)
#   2. docker compose up -d --build
#   3. docker compose exec web python manage.py createsuperuser
#   4. Open http://localhost:8080/admin/
#
# For production with HTTPS, see docs/DEPLOYMENT.md
# =============================================================================

services:
  # ---------- Database ----------
  db:
    image: postgres:16-alpine
    container_name: dcadmin_db
    environment:
      POSTGRES_DB: ${DB_NAME:-dcadmin}
      POSTGRES_USER: ${DB_USER:-dcadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dcadmin} -d ${DB_NAME:-dcadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dcadmin_net

  # ---------- Redis (for caching & sessions) ----------
  redis:
    image: redis:7-alpine
    container_name: dcadmin_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dcadmin_net

  # ---------- Web app (Django + Gunicorn) ----------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dcadmin_web
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        python manage.py compilemessages &&
        gunicorn example.wsgi:application
          --bind 0.0.0.0:8000
          --workers 4
          --threads 2
          --timeout 120
          --max-requests 1000
          --max-requests-jitter 100
          --access-logfile -
          --error-logfile -
      "
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-example.settings}
      - SECRET_KEY=${SECRET_KEY:-please_change_this_secret_key_in_production}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DATABASE_URL=postgres://${DB_USER:-dcadmin}:${DB_PASSWORD:-change_me_in_production}@db:5432/${DB_NAME:-dcadmin}
      - REDIS_URL=redis://redis:6379/0
      - LANGUAGE_CODE=${LANGUAGE_CODE:-fa}
      - TIME_ZONE=${TIME_ZONE:-Asia/Tehran}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - dcadmin_net

  # ---------- Nginx reverse proxy (optional, for production) ----------
  # Uncomment to enable Nginx with static file serving and HTTPS termination.
  #
  # nginx:
  #   image: nginx:alpine
  #   container_name: dcadmin_nginx
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - static_files:/usr/share/nginx/static:ro
  #     - media_files:/usr/share/nginx/media:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   depends_on:
  #     - web
  #   restart: unless-stopped
  #   networks:
  #     - dcadmin_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_files:
    driver: local
  media_files:
    driver: local

networks:
  dcadmin_net:
    driver: bridge
