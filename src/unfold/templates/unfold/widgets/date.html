{% load i18n %}
<div class="flex flex-col max-w-2xl min-w-56 relative w-full">
    {% if LANGUAGE_BIDI %}
        <input type="text"
               name="{{ widget.name }}"
               {% if widget.value != None %}value="{{ widget.value }}"{% endif %}
               data-jalali-datepicker
               {% if widget.value != None %}data-gregorian="{{ widget.value }}"{% endif %}
               autocomplete="off"
               class="unfold-jalali-input {{ widget.attrs.class|default:'' }}"
               id="{{ widget.attrs.id|default:'' }}">
    {% else %}
        {% include "django/forms/widgets/input.html" %}
    {% endif %}
</div>
