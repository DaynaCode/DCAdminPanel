# =============================================================================
# nginx.conf — sample Nginx config for django-unfold production deployment
# =============================================================================
# Copy to /etc/nginx/sites-available/myproject and edit server_name + paths.
#
#   sudo cp nginx.conf /etc/nginx/sites-available/myproject
#   sudo ln -s /etc/nginx/sites-available/myproject /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS certificates, use certbot:
#   sudo certbot --nginx -d yourdomain.com
# =============================================================================

# Upstream definition — Gunicorn running on the host or in Docker
upstream gunicorn_backend {
    # If running Gunicorn directly on the host:
    server 127.0.0.1:8000;
    
    # If running in Docker with port mapping "8000:8000":
    # server 127.0.0.1:8000;
    
    # If using docker-compose with the "web" service exposed:
    # server web:8000;
    
    keepalive 32;
}

# ---------- Rate limiting zone (protect admin login) ----------
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;

# ---------- HTTP -> HTTPS redirect ----------
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    
    # Let's Encrypt challenge location (must be served over HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect everything else to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ---------- HTTPS server ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;
    
    # ---------- SSL certificates ----------
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    # ---------- SSL settings (modern) ----------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # HSTS (only enable if you're sure you want HTTPS forever)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # ---------- Security headers ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self';" always;
    
    # ---------- Max upload size ----------
    # Adjust based on your needs (50M for typical admin uploads)
    client_max_body_size 50M;
    
    # ---------- Static files (served by Nginx, not Django) ----------
    location /static/ {
        # Path to collectstatic output
        alias /path/to/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # Custom 404 handler — try Django's static files as fallback
        try_files $uri =404;
    }
    
    # ---------- Vazirmatn font files — aggressive caching ----------
    # Fonts rarely change, so cache for 1 year
    location ~* ^/static/unfold/fonts/.*\.woff2$ {
        alias /path/to/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }
    
    # ---------- Media files (user uploads) ----------
    location /media/ {
        alias /path/to/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # ---------- Favicon ----------
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
    
    # ---------- Robots.txt ----------
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
    
    # ---------- Admin login rate limiting ----------
    location ~ ^/(fa|en)/admin/login/$ {
        limit_req zone=admin_login burst=5 nodelay;
        proxy_pass http://gunicorn_backend;
        include /etc/nginx/snippets/proxy_params.conf;
    }
    
    # ---------- Main proxy to Gunicorn ----------
    location / {
        proxy_pass http://gunicorn_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_redirect off;
        
        # WebSocket support (for channels, if used)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # ---------- Custom error pages ----------
    error_page 500 502 503 504 /custom_50x.html;
    location = /custom_50x.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    # ---------- Gzip compression ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2
        application/font-woff
        application/vnd.ms-fontobject
        application/x-font-ttf;
}

# ---------- Default server (catch-all for unknown hostnames) ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    
    server_name _;
    
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    return 444;
}
